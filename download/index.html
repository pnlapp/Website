<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />

  <title>Download PnL App</title>

  <script>
    (function () {
      const APP_STORE_URL =
        "https://apps.apple.com/us/app/pnl-app/id6756570340";

      const PLAY_STORE_URL =
        "https://play.google.com/store/apps/details?id=co.pnlapp";

      const ua =
        navigator.userAgent ||
        navigator.vendor ||
        window.opera ||
        "";

      const isAndroid = /android/i.test(ua);

      const isIOS =
        /iPad|iPhone|iPod/.test(ua) ||
        (navigator.platform === "MacIntel" &&
          navigator.maxTouchPoints > 1);

      if (isAndroid) {
        window.location.replace(PLAY_STORE_URL);
      } else if (isIOS) {
        window.location.replace(APP_STORE_URL);
      }
    })();
  </script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

      background: #ffffff;
      color: #111111;
    }

    main {
      width: 100%;
      max-width: 520px;
      text-align: center;
    }

    h1 {
      margin: 0 0 16px;
      font-size: 48px;
      letter-spacing: -2px;
    }

    p {
      margin: 0 auto 28px;
      max-width: 420px;
      font-size: 17px;
      line-height: 1.5;
      color: #666666;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;

      min-width: 200px;
      min-height: 54px;

      padding: 14px 22px;
      border-radius: 14px;

      background: #111111;
      color: #ffffff;

      text-decoration: none;
      font-size: 16px;
      font-weight: 600;
    }

    .note {
      margin-top: 24px;
      font-size: 13px;
      color: #999999;
    }
  </style>
</head>

<body>
  <main>
    <h1>Get PnL App</h1>

    <p>
      Track your trading behavior, understand your patterns,
      and build better discipline.
    </p>

    <div class="buttons">
      <a href="https://apps.apple.com/us/app/pnl-app/id6756570340">
        Download on the App Store
      </a>

      <a href="https://play.google.com/store/apps/details?id=co.pnlapp">
        Get it on Google Play
      </a>
    </div>

    <div class="note">
      Choose your device to continue.
    </div>
  </main>
</body>
</html>
