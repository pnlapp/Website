# Deploys the pnlapp.co marketing site plus the blog (built from the
# separate pnlapp/pnl-blog repo) merged in at /blog.
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website
        uses: actions/checkout@v4
        with:
          path: website

      - name: Checkout blog
        uses: actions/checkout@v4
        with:
          repository: pnlapp/pnl-blog
          path: pnl-blog

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pnl-blog/package-lock.json

      - name: Install blog dependencies
        working-directory: pnl-blog
        run: npm ci

      - name: Build blog
        working-directory: pnl-blog
        run: npm run build
        env:
          PUBLIC_NEWSLETTER_ENDPOINT: ${{ secrets.NEWSLETTER_ENDPOINT }}

      - name: Merge blog build into website output
        run: |
          rm -rf website/blog
          mkdir -p website/blog
          cp -r pnl-blog/dist/blog/. website/blog/
          # Astro's bundled JS/CSS build under dist/_astro (referenced as
          # /blog/_astro/... via assetsPrefix) regardless of the /blog page
          # nesting, so it needs copying in separately to line up.
          mkdir -p website/blog/_astro
          cp -r pnl-blog/dist/_astro/. website/blog/_astro/
          # Publish the blog sitemap at the URL declared in website/robots.txt.
          # Astro emits its sitemap files at the build root, so adjust the
          # sitemap index to reference the copied /blog child sitemap.
          cp pnl-blog/dist/sitemap-*.xml website/blog/
          cp pnl-blog/dist/sitemap-index.xml website/blog/sitemap-index.xml
          sed -i 's#https://pnlapp.co/sitemap-#https://pnlapp.co/blog/sitemap-#g' website/blog/sitemap-index.xml

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
