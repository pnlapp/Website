# Deploys the pnlapp.co marketing site plus the blog (built from the
# separate pnlapp/pnl-blog repo) merged in at /blog.
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website
        uses: actions/checkout@v4
        with:
          path: website
          # The previous commit is needed to notify IndexNow only about
          # pages changed by this deployment.
          fetch-depth: 2

      - name: Checkout blog
        uses: actions/checkout@v4
        with:
          repository: pnlapp/pnl-blog
          path: pnl-blog

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pnl-blog/package-lock.json

      - name: Install blog dependencies
        working-directory: pnl-blog
        run: npm ci

      - name: Build blog
        working-directory: pnl-blog
        run: npm run build
        env:
          PUBLIC_NEWSLETTER_ENDPOINT: ${{ secrets.NEWSLETTER_ENDPOINT }}

      - name: Merge blog build into website output
        run: |
          rm -rf website/blog
          mkdir -p website/blog
          cp -r pnl-blog/dist/blog/. website/blog/
          # Astro's bundled JS/CSS build under dist/_astro (referenced as
          # /blog/_astro/... via assetsPrefix) regardless of the /blog page
          # nesting, so it needs copying in separately to line up.
          mkdir -p website/blog/_astro
          cp -r pnl-blog/dist/_astro/. website/blog/_astro/
          # Publish the blog sitemap at the URL declared in website/robots.txt.
          # Astro emits its sitemap files at the build root, so adjust the
          # sitemap index to reference the copied /blog child sitemap.
          cp pnl-blog/dist/sitemap-*.xml website/blog/
          cp pnl-blog/dist/sitemap-index.xml website/blog/sitemap-index.xml
          sed -i 's#https://pnlapp.co/sitemap-#https://pnlapp.co/blog/sitemap-#g' website/blog/sitemap-index.xml

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Notify IndexNow about changed pages
        # IndexNow should receive pages that changed in this deployment, not
        # a recurring dump of the entire site. A shared site asset change
        # affects every static website page, so submit those pages together.
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          INDEXNOW_KEY: e9456da49c0d491791e0a1d4a6a7da8a
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          declare -a urls=()

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            # A manual run is used once, immediately after initial setup, to
            # prove the integration end-to-end without resubmitting the site.
            urls=("https://pnlapp.co/")
          else
            if [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
              echo "No previous commit available; skipping IndexNow."
              exit 0
            fi

            declare -a changed_files=()
            while IFS= read -r file; do
              changed_files+=("$file")
            done < <(git -C website diff --name-only "$BEFORE_SHA" "$CURRENT_SHA")
            shared_asset_changed=false

            for file in "${changed_files[@]}"; do
              if [[ "$file" == assets/* ]]; then
                shared_asset_changed=true
              elif [[ "$file" == "index.html" ]]; then
                urls+=("https://pnlapp.co/")
              elif [[ "$file" == */index.html ]]; then
                urls+=("https://pnlapp.co/${file%/index.html}/")
              fi
            done

            if [ "$shared_asset_changed" = true ]; then
              urls=()
              while IFS= read -r file; do
                relative_path="${file#website/}"
                if [ "$relative_path" = "index.html" ]; then
                  urls+=("https://pnlapp.co/")
                else
                  urls+=("https://pnlapp.co/${relative_path%/index.html}/")
                fi
              done < <(find website -path website/blog -prune -o -name index.html -print)
            fi
          fi

          if [ "${#urls[@]}" -eq 0 ]; then
            echo "No publishable HTML pages changed; skipping IndexNow."
            exit 0
          fi

          printf '%s\n' "${urls[@]}" | sort -u > /tmp/indexnow-urls.txt
          jq -n \
            --arg host "pnlapp.co" \
            --arg key "$INDEXNOW_KEY" \
            --arg keyLocation "https://pnlapp.co/$INDEXNOW_KEY.txt" \
            --rawfile urls /tmp/indexnow-urls.txt \
            '{host: $host, key: $key, keyLocation: $keyLocation, urlList: ($urls | split("\n") | map(select(length > 0)))}' \
            > /tmp/indexnow-payload.json

          curl --fail --silent --show-error \
            --request POST "https://api.indexnow.org/IndexNow" \
            --header "Content-Type: application/json; charset=utf-8" \
            --data @/tmp/indexnow-payload.json
          echo "IndexNow received $(wc -l < /tmp/indexnow-urls.txt) changed URLs."
